name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: clang-14
            std: 17
            cc: clang-14
            cxx: clang++-14
          - os: ubuntu-22.04
            compiler: gcc-12
            std: 17
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: gcc-12
            std: 20
            cc: gcc-12
            cxx: g++-12
          - os: macos-14
            compiler: clang
            std: 17
            cc: clang
            cxx: clang++
          - os: windows-2022
            compiler: msvc
            std: 17
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --parallel

      - name: Test (single-threaded to avoid TempDir races)
        run: ctest --test-dir build --output-on-failure -j1

  coverage:
    name: Coverage (LCOV)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build lcov

      - name: Configure (coverage build)
        run: |
          cmake -B build-cov \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -G Ninja

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure -j1

      - name: Collect LCOV data
        run: |
          lcov --capture \
            --directory build-cov \
            --output-file coverage.info
          lcov --remove coverage.info \
            '*/tests/*' '*/catch2/*' '*/FetchContent/*' '*/_deps/*' \
            '/usr/include/*' '/usr/lib/*' \
            --output-file coverage.info

      - name: Enforce 70% line coverage gate
        run: |
          COVERAGE=$(lcov --summary coverage.info 2>&1 | awk '/lines/ {gsub(/%/,""); print $2}')
          echo "Line coverage: ${COVERAGE}%"
          if ! awk "BEGIN {exit (${COVERAGE} + 0 >= 70) ? 0 : 1}"; then
            echo "::error::Line coverage ${COVERAGE}% is below the required 70%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.info

  relay-conform:
    name: RELAY conformance (relay conform)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build CLI
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -G Ninja
          cmake --build build --parallel --target cpp-can-cli

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install relay tool
        run: go install github.com/SoundMatt/RELAY/cmd/relay@latest

      - name: RELAY conformance gate
        run: relay conform --strict ./build/cli/cpp-can-cli

      - name: RELAY interop gate (§20 Continuous Conformance)
        run: relay interop --protocol CAN --strict ./build/cli/cpp-can-cli

  sanitizers:
    name: ASan + UBSan (IEC 61508 SIL-2 dynamic analysis)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc-12 g++-12

      - name: Configure (ASan + UBSan)
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B build-san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -G Ninja

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test with sanitizers
        env:
          ASAN_OPTIONS: "halt_on_error=1:detect_stack_use_after_return=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build-san --output-on-failure -j1

  can-interop:
    name: Live SocketCAN interop (vcan0 self-interop + can-utils third-party peer, ROADMAP.md "Interop testing")
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      # Probe-then-skip-cleanly posture, mirroring rust-DDS's cyclone-interop
      # job: this setup is expected to work on a stock GitHub-hosted
      # ubuntu-22.04 runner, but ordinary CI runs must not hard-fail if a
      # future runner image sandboxes the vcan kernel module or otherwise
      # makes it unavailable.
      - name: Load vcan module, bring up vcan0, install can-utils
        id: setup
        run: |
          set +e
          sudo modprobe vcan \
            && sudo ip link add dev vcan0 type vcan \
            && sudo ip link set up vcan0 \
            && sudo apt-get install -y can-utils
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Live SocketCAN interop SKIPPED::vcan/can-utils setup failed (exit $status) on this runner — 0 live SocketCAN interop tests were executed this run. See ROADMAP.md 'Interop testing' and issue #30."
            {
              echo "### :warning: Live SocketCAN interop SKIPPED"
              echo
              echo "\`vcan\`/\`can-utils\` setup failed (exit \`$status\`) on this runner, so **0 live SocketCAN interop tests ran this job** — only the skip path executed. This is a known GitHub-hosted-runner kernel limitation (the \`vcan\` module is absent), not a code regression. See ROADMAP.md and #30."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify vcan0 is up
        if: steps.setup.outputs.available == 'true'
        run: ip -details link show vcan0

      - name: Configure (CPPCAN_INTEROP_TESTS=ON)
        if: steps.setup.outputs.available == 'true'
        run: |
          cmake -B build-interop \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPCAN_INTEROP_TESTS=ON \
            -G Ninja

      - name: Build
        if: steps.setup.outputs.available == 'true'
        run: cmake --build build-interop --parallel

      - name: Run live SocketCAN interop tests (two-process self-interop + cangen/candump third-party peer)
        if: steps.setup.outputs.available == 'true'
        run: ctest --test-dir build-interop --output-on-failure -j1 -L can-interop

      - name: Live-path summary
        if: steps.setup.outputs.available == 'true'
        run: |
          echo "### :white_check_mark: Live SocketCAN interop ran (real \`vcan0\` traffic)" >> "$GITHUB_STEP_SUMMARY"

  fusa-asil-b:
    name: cpp-FuSa ASIL-B qualification
    runs-on: ubuntu-22.04
    needs: build-and-test
    permissions:
      contents: write
    env:
      # cpp-FuSa version pin (§20.1.2 — an explicit, identical tag everywhere
      # cpp-FuSa is checked out; never a floating branch/@latest). Bump
      # deliberately, verifying the ASIL-B pipeline still passes, on a cadence
      # tied to cpp-FuSa releases.
      CPP_FUSA_REF: v0.17.1
      # Current, disclosed ISO 26262 / IEC 61508 Part 6 gap-report baseline
      # (see "Enforce gap-report baselines" below) — tracked in #36. Lower
      # these as real safety-lifecycle documentation (architectural design,
      # unit design/verification/test records, safety manual, configuration
      # management plan, ASIL decomposition, verification independence) is
      # added; CI fails if the gap count regresses above the baseline.
      ISO26262_GAP_BASELINE: 12
      IEC61508_GAP_BASELINE: 10
    steps:
      - name: Check out cpp-CAN
        uses: actions/checkout@v4
        with:
          path: cpp-CAN

      - name: Check out cpp-FuSa
        uses: actions/checkout@v4
        with:
          repository: SoundMatt/cpp-FuSa
          ref: ${{ env.CPP_FUSA_REF }}
          path: cpp-FuSa

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build zip

      - name: Build cpfusa
        run: |
          cmake -B cpp-FuSa/build \
            -S cpp-FuSa \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build cpp-FuSa/build --parallel

      - name: Generate .fusa-reqs.json from requirements/requirements.json
        working-directory: cpp-CAN
        run: python3 scripts/gen_fusa_reqs.py

      # No --force: .fusa.json and .fusa-reqs.json are real, committed
      # project config/evidence, not scaffolding — cpfusa init --force
      # unconditionally resets .fusa-reqs.json to {"requirements":[]} even
      # when it already has content (§9.1 "create with empty requirements
      # array"), which is exactly why traceability was always 0% (#26).
      # Without --force this is a no-op once the files exist (exit 0).
      - name: cpfusa init (no-op once .fusa.json/.fusa-reqs.json exist)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa init --name cpp-CAN --standard iso26262 --asil ASIL-B --project-version 0.1.0

      - name: cpfusa check
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa check --dir .

      - name: cpfusa lint
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa lint --dir .

      - name: cpfusa trace (requirements traceability)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa trace --dir .

      - name: cpfusa cyber
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa cyber --write --dir .

      - name: cpfusa qualify (ASIL-B gate)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa qualify --dir .

      - name: cpfusa hara init (no-op once .fusa-hara.json exists)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa hara init --project cpp-CAN --dir .

      # Evidence-generating steps run BEFORE iso26262/iec61508 below, not
      # after: the gap reports look for tara.json/fmea.json/safety-case.json/
      # sci.json/etc on disk, so running them afterwards (the previous step
      # order) meant the gap checks always saw those artifacts as absent —
      # inflating "gap" to "gap" instead of "addressed"/"partial" — before a
      # single real gap had been assessed.
      - name: cpfusa boundary
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa boundary --dir .

      - name: cpfusa tara
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa tara --dir .

      - name: cpfusa fmea
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa fmea --dir .

      - name: cpfusa safety-case
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa safety-case --dir .

      - name: cpfusa sas
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa sas --dir .

      - name: cpfusa sci
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa sci --dir .

      # iso26262/iec61508 report a real, substantive backlog of ISO 26262
      # Part 6 / IEC 61508 lifecycle documentation this project does not yet
      # have (architectural design, unit verification/test records, safety
      # manual, etc. — see #36) — that is not something to fabricate in CI.
      # continue-on-error keeps the step's own red "X" visible in the GitHub
      # Actions UI (unlike `|| true`, which hid it entirely) while the
      # baseline-gate step below still fails the job on a real regression.
      - name: cpfusa iso26262 (ASIL-B)
        id: iso26262
        working-directory: cpp-CAN
        continue-on-error: true
        run: |
          ../cpp-FuSa/build/cpfusa iso26262 \
            --asil ASIL-B \
            --output iso26262-gap-report.json \
            --dir .

      - name: Enforce ISO 26262 gap-report baseline (tracked in #36)
        working-directory: cpp-CAN
        run: |
          gap=$(python3 -c "import json;print(sum(1 for o in json.load(open('iso26262-gap-report.json'))['objectives'] if o['status']=='gap'))")
          echo "ISO 26262 gaps: $gap (baseline: ${ISO26262_GAP_BASELINE})"
          if [ "$gap" -gt "${ISO26262_GAP_BASELINE}" ]; then
            echo "::error::ISO 26262 gap count regressed: $gap > baseline ${ISO26262_GAP_BASELINE} — see #36"
            exit 1
          fi
          if [ "$gap" -lt "${ISO26262_GAP_BASELINE}" ]; then
            echo "::notice::ISO 26262 gap count improved ($gap < baseline ${ISO26262_GAP_BASELINE}) — lower ISO26262_GAP_BASELINE in ci.yml"
          fi

      - name: cpfusa iec61508 (SIL-2)
        id: iec61508
        working-directory: cpp-CAN
        continue-on-error: true
        run: |
          ../cpp-FuSa/build/cpfusa iec61508 \
            --sil SIL-2 \
            --output iec61508-gap-report.json \
            --dir .

      - name: Enforce IEC 61508 gap-report baseline (tracked in #36)
        working-directory: cpp-CAN
        run: |
          gap=$(python3 -c "import json;print(sum(1 for o in json.load(open('iec61508-gap-report.json'))['objectives'] if o['status']=='gap'))")
          echo "IEC 61508 gaps: $gap (baseline: ${IEC61508_GAP_BASELINE})"
          if [ "$gap" -gt "${IEC61508_GAP_BASELINE}" ]; then
            echo "::error::IEC 61508 gap count regressed: $gap > baseline ${IEC61508_GAP_BASELINE} — see #36"
            exit 1
          fi
          if [ "$gap" -lt "${IEC61508_GAP_BASELINE}" ]; then
            echo "::notice::IEC 61508 gap count improved ($gap < baseline ${IEC61508_GAP_BASELINE}) — lower IEC61508_GAP_BASELINE in ci.yml"
          fi

      - name: cpfusa badge
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa badge --dir .

      - name: cpfusa vuln
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa vuln --dir .

      - name: cpfusa release (SBOM + provenance + artifact manifest — §20.5)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa release --dir .

      - name: cpfusa metrics record
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa metrics record --dir .

      - name: cpfusa report (JSON)
        working-directory: cpp-CAN
        run: |
          ../cpp-FuSa/build/cpfusa report \
            --format json \
            --output check-report.json \
            --dir .

      - name: Upload ASIL-B evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asil-b-evidence
          if-no-files-found: error
          path: |
            cpp-CAN/check-report.json
            cpp-CAN/qualify-report.json
            cpp-CAN/cyber-report.json
            cpp-CAN/tara.json
            cpp-CAN/tara.md
            cpp-CAN/fmea.json
            cpp-CAN/fmea.csv
            cpp-CAN/safety-case.json
            cpp-CAN/safety-case.mermaid
            cpp-CAN/safety-case.md
            cpp-CAN/sbom.json
            cpp-CAN/provenance.json
            cpp-CAN/artifact-manifest.json
            cpp-CAN/fusa-badge.svg
            cpp-CAN/iso26262-gap-report.json
            cpp-CAN/iec61508-gap-report.json
            cpp-CAN/sas.json
            cpp-CAN/sas.md
            cpp-CAN/sci.json
            cpp-CAN/vuln.json
            cpp-CAN/boundary.mermaid
            cpp-CAN/boundary.dot
            cpp-CAN/.fusa-hara.json
            cpp-CAN/.fusa-metrics.json

      # §20.5: attach the supply-chain evidence to the GitHub Release itself,
      # not just this ephemeral, retention-windowed CI-run artifact bundle —
      # a downstream consumer of a release has no other way to obtain the
      # SBOM/provenance for the version they installed once the run artifact
      # expires.
      - name: Attach evidence to the GitHub Release
        if: github.event_name == 'release'
        working-directory: cpp-CAN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            sbom.json provenance.json artifact-manifest.json \
            safety-case.json safety-case.md tara.json tara.md \
            fmea.json fmea.csv sas.json sas.md sci.json \
            iso26262-gap-report.json iec61508-gap-report.json \
            fusa-badge.svg \
            --clobber

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-14 clang-tidy-14

      - name: Configure (generate compile_commands.json)
        env:
          CC: clang-14
          CXX: clang++-14
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -G Ninja

      - name: clang-tidy
        run: |
          find src include -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-tidy-14 \
              -p build \
              --checks='-*,clang-analyzer-*,bugprone-*,modernize-use-override,modernize-use-nullptr,cppcoreguidelines-no-malloc' \
              2>&1 | tee clang-tidy.log || true
          if grep -q "error:" clang-tidy.log; then
            echo "::error::clang-tidy reported errors"
            grep "error:" clang-tidy.log
            exit 1
          fi

  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-22.04
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target test -t cpp-can-test .

      - name: Smoke test - run all tests in container
        run: docker run --rm cpp-can-test --reporter compact

  sarif:
    name: SARIF upload
    runs-on: ubuntu-22.04
    needs: build-and-test
    permissions:
      security-events: write
    steps:
      - name: Check out cpp-CAN
        uses: actions/checkout@v4
        with:
          path: cpp-CAN

      - name: Check out cpp-FuSa
        uses: actions/checkout@v4
        with:
          repository: SoundMatt/cpp-FuSa
          ref: v0.17.1
          path: cpp-FuSa

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build cpfusa
        run: |
          cmake -B cpp-FuSa/build \
            -S cpp-FuSa \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build cpp-FuSa/build --parallel

      - name: Generate .fusa-reqs.json from requirements/requirements.json
        working-directory: cpp-CAN
        run: python3 scripts/gen_fusa_reqs.py

      - name: cpfusa init (no-op once .fusa.json/.fusa-reqs.json exist)
        working-directory: cpp-CAN
        run: ../cpp-FuSa/build/cpfusa init --name cpp-CAN --standard iso26262 --asil ASIL-B --project-version 0.1.0

      - name: Generate SARIF report
        working-directory: cpp-CAN
        run: |
          ../cpp-FuSa/build/cpfusa check \
            --format sarif \
            --output cpfusa.sarif \
            --dir .

      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('cpp-CAN/cpfusa.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cpp-CAN/cpfusa.sarif
